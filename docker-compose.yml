version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mentee_mentor_db
    restart: always
    environment:
      MYSQL_DATABASE: mentee_mentor
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: mentee_mentor_adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  mysql_data:
